# Deploy directly on Render via: New -> Blueprint -> Connect GitHub Repo

services:
  - type: web
    name: nex-store-fullstack-api
    runtime: node
    plan: standard
    region: frankfurt
    branch: main
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: nex-sqlite-wal-disk
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: RENDER_SERVICE_NAME
        value: nex-store-fullstack-api
      - key: RENDER_REGION
        value: frankfurt
      - key: NEX_SQLITE_DB_PATH
        value: /var/data/nex-store.sqlite
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nex_store
      - key: MONGODB_CLUSTER_REGION
        value: aws-eu-central-1
      - key: MONGODB_SYNC_MODE
        value: DUAL_WRITE_HYBRID
      - key: NEX_ADMIN_USERNAME
        value: nex_root_admin
      - key: NEX_ADMIN_EMAIL
        value: admin@nexstore.dev
      - key: NEX_ADMIN_PASSWORD
        sync: false
      - key: NEX_ADMIN_MASTER_TOKEN
        generateValue: true
      - key: NEX_PAYMENT_GATEWAY_MODE
        value: LIVE_SETTLEMENT
      - key: NEX_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: NEX_NETLIFY_DEPLOY_HOOK
        value: https://api.netlify.com/build_hooks/nex_cluster_live
      - key: NEX_RENDER_DEPLOY_HOOK
        value: https://api.render.com/deploy/srv-nexstore-live
      - key: CORS_ALLOWED_ORIGINS
        value: https://nex-store-global.netlify.app,https://nex-store-api.onrender.com
