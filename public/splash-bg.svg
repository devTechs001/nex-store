<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="nebulaIndigo" cx="22%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="78%" cy="75%" r="58%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.36"/>
      <stop offset="50%" stop-color="#083344" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#030611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaEmerald" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#030611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridLine" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="540" x2="1920" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cyberGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="url(#gridLine)" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="80" cy="80" r="1.5" fill="#38bdf8" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Deep Space Quantum Canvas -->
  <rect width="1920" height="1080" fill="#030611"/>
  <rect width="1920" height="1080" fill="url(#nebulaIndigo)"/>
  <rect width="1920" height="1080" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="1080" fill="url(#nebulaEmerald)"/>

  <!-- Fine CAD Blueprint Matrix -->
  <rect width="1920" height="1080" fill="url(#cyberGrid)"/>

  <!-- Perspective Horizon Floor Traces -->
  <g opacity="0.45" stroke="url(#gridLine)" stroke-width="1.4">
    <line x1="960" y1="540" x2="-200" y2="1080"/>
    <line x1="960" y1="540" x2="180" y2="1080"/>
    <line x1="960" y1="540" x2="560" y2="1080"/>
    <line x1="960" y1="540" x2="960" y2="1080"/>
    <line x1="960" y1="540" x2="1360" y2="1080"/>
    <line x1="960" y1="540" x2="1740" y2="1080"/>
    <line x1="960" y1="540" x2="2120" y2="1080"/>
    <line x1="0" y1="640" x2="1920" y2="640"/>
    <line x1="0" y1="740" x2="1920" y2="740"/>
    <line x1="0" y1="850" x2="1920" y2="850"/>
    <line x1="0" y1="970" x2="1920" y2="970"/>
  </g>

  <!-- Horizon Laser Beam -->
  <rect x="0" y="538" width="1920" height="3" fill="url(#horizonGlow)"/>

  <!-- Concentric Quantum Core Rings -->
  <g transform="translate(960, 540)" opacity="0.55">
    <circle r="440" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="14 10" stroke-opacity="0.4"/>
    <circle r="350" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 14" stroke-opacity="0.5"/>
    <circle r="260" stroke="#10b981" stroke-width="1.2" stroke-dasharray="24 12" stroke-opacity="0.4"/>
    <circle r="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Left & Right Hardware Printed Circuit Board (PCB) Traces -->
  <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.35" fill="none">
    <path d="M 80 180 H 320 L 390 250 H 540"/>
    <circle cx="540" cy="250" r="5" fill="#22d3ee"/>
    <path d="M 60 320 H 260 L 330 390 H 460"/>
    <circle cx="460" cy="390" r="4" fill="#10b981"/>
    <path d="M 1840 180 H 1600 L 1530 250 H 1380"/>
    <circle cx="1380" cy="250" r="5" fill="#818cf8"/>
    <path d="M 1860 320 H 1660 L 1590 390 H 1460"/>
    <circle cx="1460" cy="390" r="4" fill="#22d3ee"/>
  </g>

  <!-- Ambient Starfield & Data Nodes -->
  <g fill="#e0f2fe" opacity="0.65">
    <circle cx="210" cy="140" r="2.5"/>
    <circle cx="420" cy="110" r="1.8"/>
    <circle cx="690" cy="160" r="2.2"/>
    <circle cx="1280" cy="130" r="2.5"/>
    <circle cx="1540" cy="160" r="1.8"/>
    <circle cx="1720" cy="110" r="2.4"/>
    <circle cx="160" cy="790" r="2.2"/>
    <circle cx="380" cy="910" r="2.8"/>
    <circle cx="1580" cy="880" r="2.5"/>
    <circle cx="1770" cy="740" r="2.0"/>
  </g>
</svg>
